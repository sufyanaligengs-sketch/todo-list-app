<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">


        <!-- ========================= -->
        <!-- LOGIN -->
        <!-- ========================= -->

        <div class="todo-card" id="loginPage">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to manage your tasks.
            </p>


            <div class="input-container">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                >

            </div>


            <div class="input-container">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                >

            </div>


            <button id="loginButton">
                Login
            </button>


            <p>
                Don't have an account?
                <button id="showRegister">
                    Register
                </button>
            </p>

        </div>



        <!-- ========================= -->
        <!-- REGISTER -->
        <!-- ========================= -->

        <div class="todo-card" id="registerPage" style="display: none;">

            <h1>Create Account</h1>

            <p class="subtitle">
                Create an account to get started.
            </p>


            <div class="input-container">

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                >

            </div>


            <div class="input-container">

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                >

            </div>


            <button id="registerButton">
                Register
            </button>


            <p>
                Already have an account?
                <button id="showLogin">
                    Login
                </button>
            </p>

        </div>



        <!-- ========================= -->
        <!-- TODO LIST -->
        <!-- ========================= -->

        <div class="todo-card" id="todoPage" style="display: none;">

            <h1>To-Do List</h1>

            <p class="subtitle">
                Organize your tasks and stay productive.
            </p>


            <!-- INPUT -->

            <div class="input-container">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                >

                <button id="addButton">
                    Add
                </button>

            </div>


            <!-- FILTER -->

            <div class="filters">

                <button
                    class="filter active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter"
                    data-filter="active"
                >
                    Active
                </button>

                <button
                    class="filter"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>


            <!-- TASK LIST -->

            <ul id="taskList"></ul>


            <!-- FOOTER -->

            <div class="footer">

                <span id="taskCount">
                    0 tasks left
                </span>

                <button id="clearCompleted">
                    Clear Completed
                </button>

            </div>


            <!-- LOGOUT -->

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
