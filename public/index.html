<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="todo-card">

            <h1>To-Do List</h1>

            <p class="subtitle">
                Organize your tasks and stay productive.
            </p>


            <!-- INPUT -->

            <div class="input-container">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                >

                <button id="addButton">
                    Add
                </button>

            </div>


            <!-- FILTER -->

            <div class="filters">

                <button
                    class="filter active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter"
                    data-filter="active"
                >
                    Active
                </button>

                <button
                    class="filter"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>


            <!-- TASK LIST -->

            <ul id="taskList"></ul>


            <!-- FOOTER -->

            <div class="footer">

                <span id="taskCount">
                    0 tasks left
                </span>

                <button id="clearCompleted">
                    Clear Completed
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
